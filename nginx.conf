# Configuration Nginx pour servir le build statique de Fihirana Jazz (SPA).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fichiers avec hash → cache long.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Service worker : jamais mis en cache (pour récupérer les mises à jour).
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Manifest PWA avec le bon type MIME.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  # SPA : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
